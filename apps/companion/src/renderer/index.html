<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <link rel="stylesheet" href="renderer.css" />
    <title>Work Learn</title>
  </head>
  <body>
    <header>
      <span class="brand">Work Learn</span>
      <button id="refresh" title="刷新">↻</button>
    </header>

    <p class="guarantee">离线可用 · 数据先存本地，无需联网也不会丢</p>

    <section class="stats">
      <div class="stat">
        <span class="num" id="today">–</span>
        <span class="label">今日采集</span>
      </div>
      <div class="stat">
        <span class="num" id="pending">–</span>
        <span class="label">待复习</span>
      </div>
      <div class="stat">
        <span class="num" id="unsynced">–</span>
        <span class="label">本地待推送</span>
      </div>
      <div class="stat wide">
        <span class="num small" id="lastSync">–</span>
        <span class="label">上次同步</span>
      </div>
    </section>

    <section class="sync-state">
      <div class="row"><span class="dot" id="cloudDot"></span><span id="cloudText">云端状态检测中…</span></div>
      <div class="row"><span class="dot local" id="localDot"></span><span id="localText">本地库检测中…</span></div>
    </section>

    <section class="actions">
      <button id="capture">采集剪贴板</button>
      <button id="captureSelection">采集选中</button>
      <button id="sync">同步云端</button>
      <button id="openWeb">打开 Web</button>
    </section>

    <section class="auto">
      <label class="switch">
        <input type="checkbox" id="autoCapture" />
        <span>自动采集（开新终端即录制）</span>
      </label>
      <button id="openRecorded">打开录制终端</button>
    </section>

    <p class="hint">全局快捷键 ⌘⇧L：拷贝当前选中文本并采集（需在系统设置授予「辅助功能」权限）</p>

    <footer id="status" class="status"></footer>
    <script src="renderer.js"></script>
  </body>
</html>
